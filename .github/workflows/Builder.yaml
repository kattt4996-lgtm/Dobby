name: Build Dobby Android arm64-v8a

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Dobby
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r23c
          add-to-path: true

      - name: Verify NDK
        run: |
          echo "NDK path: $ANDROID_NDK_HOME"
          ls $ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake

      - name: Build Dobby arm64-v8a
        run: |
          mkdir -p build-android-arm64
          cd build-android-arm64

          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release

          make -j$(nproc)

      - name: Find artifacts
        run: |
          echo "=== Cari libdobby ==="
          find . -name "libdobby*.a" -o -name "libdobby*.so"
          echo ""
          echo "=== Isi build folder ==="
          ls -la build-android-arm64/

      - name: Package artifacts
        run: |
          mkdir -p output/lib/arm64-v8a
          mkdir -p output/include

          find build-android-arm64 -name "libdobby*.a" -exec cp {} output/lib/arm64-v8a/ \;
          find build-android-arm64 -name "libdobby*.so" -exec cp {} output/lib/arm64-v8a/ \;
          cp include/dobby.h output/include/

          echo "=== Hasil packaging ==="
          find output -type f

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dobby-android-arm64-v8a
          path: output/
          retention-days: 30
          
