name: Build Dobby Android ARM64

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c          # ← GANTI KE r25c
          add-to-path: true
      
      - name: Build Dobby ARM64
        run: |
          mkdir -p build-android-arm64
          cd build-android-arm64
          
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          
          make -j$(nproc)
      
      - name: Package
        run: |
          mkdir -p output/lib/arm64-v8a output/include
          find build-android-arm64 -name "libdobby*.a" -exec cp {} output/lib/arm64-v8a/ \;
          find build-android-arm64 -name "libdobby*.so" -exec cp {} output/lib/arm64-v8a/ \;
          cp include/dobby.h output/include/
          find output -type f
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: dobby-android-arm64
          path: output/
